name: Build Mihon APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: List tasks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:tasks --all --no-daemon | grep -i assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihon-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
